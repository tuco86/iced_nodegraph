[package]
name = "demo_styling"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "styling"
path = "src/main.rs"
doc = false

# `wasm-pack build --features wasm` (build_docs.sh) is the only consumer: it
# turns on the browser entry points and embeds a font, since a browser has no
# system fonts to detect.
[features]
default = []
wasm = ["console_error_panic_hook", "iced/fira-sans", "wasm-bindgen"]

[dependencies]
demo_common.workspace = true
iced = { workspace = true, features = ["wgpu", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland"] }
iced_nodegraph.workspace = true

console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
