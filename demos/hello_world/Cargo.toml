[package]
name = "demo_hello_world"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hello_world"
path = "src/main.rs"
doc = false

# `wasm-pack build --features wasm` (build_docs.sh) is the only consumer: it
# turns on the browser entry points and embeds a font, since a browser has no
# system fonts to detect.
[features]
default = []
wasm = ["console_error_panic_hook", "iced/fira-sans", "wasm-bindgen"]

[dependencies]
demo_common.workspace = true
iced = { workspace = true, features = ["wgpu", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland"] }
iced_nodegraph.workspace = true
iced_palette.workspace = true
# Node and edge ids; runs on both native and WASM (see getrandom below).
nanoid.workspace = true

console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

# The `persistence` module is `cfg(not(target_arch = "wasm32"))`, so these are
# only ever compiled for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories.workspace = true
serde.workspace = true
serde_json.workspace = true

# getrandom 0.3 (nanoid -> rand) has no implicit browser backend. It also needs
# `--cfg getrandom_backend="wasm_js"`, exported in build_docs.sh (or a local
# .cargo/config.toml for ad-hoc wasm checks).
#
# The 0.3 requirement tracks `rand_core` 0.9, not the newest release: declaring
# 0.4 here would put two getrandom copies in the wasm graph, and only one of
# them would carry the browser backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
