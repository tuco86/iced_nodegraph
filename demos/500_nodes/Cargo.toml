[package]
name = "demo_500_nodes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "500_nodes"
path = "src/main.rs"
doc = false

[dependencies]
demo_common.workspace = true
# `canvas` draws the per-op timing chart in the stats panel.
iced = { workspace = true, features = ["wgpu", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland", "canvas"] }
iced_nodegraph.workspace = true
# `set_index_probe` for the SDF counters in the stats panel.
iced_nodegraph_sdf.workspace = true
# `Instant` that also works in the browser.
web-time.workspace = true
