[package]
name = "demo_500_nodes"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "500_nodes"
path = "src/main.rs"
doc = false

# `wasm-pack build --features wasm` (build_docs.sh) is the only consumer: it
# turns on the browser entry points and embeds a font, since a browser has no
# system fonts to detect.
[features]
default = []
wasm = ["console_error_panic_hook", "iced/fira-sans", "wasm-bindgen"]

[dependencies]
# `canvas` draws the per-op timing chart in the stats panel.
iced = { workspace = true, features = ["wgpu", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland", "canvas"] }
iced_nodegraph.workspace = true
# `set_index_probe` for the SDF counters in the stats panel.
iced_nodegraph_sdf.workspace = true
# `Instant` that also works in the browser.
web-time.workspace = true

console_error_panic_hook = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
