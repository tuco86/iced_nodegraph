[package]
name = "iced_nodegraph_bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Criterion's dependency tree (clap, plotters, rayon, serde, ciborium) is a
# package-wide `dev-dependency` wherever the bench lives, so inside
# `iced_nodegraph` every `cargo test` would compile all of it for targets that
# never link criterion. In its own member only `cargo bench -p
# iced_nodegraph_bench` pays.
[[bench]]
name = "shape_eval"
path = "shape_eval.rs"
harness = false

[dependencies]
criterion.workspace = true
iced_nodegraph_sdf.workspace = true
