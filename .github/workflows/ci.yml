name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel a superseded in-flight run when a ref gets a new push - keeps the
# parallel feature branches from piling stale runs onto the shared runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Native-only. The wasm32-unknown-unknown target check stays in the local
# pre-push checklist (see CLAUDE.md).
env:
  CARGO_TERM_COLOR: always
  # Drop debuginfo in CI: the workspace dev profile is opt-level=1, and
  # debuginfo is the single biggest contributor to target/ size. Cutting it
  # keeps the cached target/ small so the ~14 GB ubuntu-latest disk does not
  # fill (a full disk crashes the runner itself: "No space left on device").
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ubuntu-latest ships ~25 GB of preinstalled SDKs (Android, .NET, GHC,
      # CodeQL) we never use. Reclaim it up front so the Rust build + restored
      # cargo cache cannot exhaust the disk mid-run.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The iced_nodegraph_sdf pixel tests render through wgpu and need a GPU
      # adapter. The runner has none, so provide Mesa's software Vulkan driver
      # (lavapipe); wgpu's Vulkan backend then finds it headlessly.
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Caches only dependency artifacts (not the workspace crates), prunes
          # stale ones, and zstd-compresses - the old manual `target/` cache had
          # ballooned to ~3.6 GB and was slow to unpack every run. Only the
          # default branch WRITES the cache; PR branches restore it read-only,
          # so the parallel feature branches share one small cache instead of
          # each saving a multi-GB blob.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p iced_nodegraph -p iced_nodegraph_sdf -- -D warnings

      - name: Test (iced_nodegraph)
        run: cargo test -p iced_nodegraph

      # The SDF pixel tests each spin up a full wgpu device and render through
      # the software Vulkan driver. Running them in parallel oversubscribes the
      # runner's few CPU cores and can make a device poll exceed its timeout, so
      # serialize them - lavapipe handles one device at a time reliably.
      - name: Test (iced_nodegraph_sdf, serialized GPU tests)
        run: cargo test -p iced_nodegraph_sdf -- --test-threads=1

  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so a git revision can serve as the semver baseline
          # before the first crates.io publish.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Run cargo-semver-checks
        run: |
          # Baseline is the most recent release tag (v*). Pre-publish there are
          # no tags, so the gate is a no-op: deliberate API changes during
          # pre-1.0 finalization stay green. The first tagged release sets the
          # baseline, after which this gate hard-fails on any unintended public
          # API break since that release.
          TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$TAG" ]; then
            echo "No release tag (v*) yet; pre-publish, skipping the semver gate."
            echo "Tag the first release to activate the public-API lock."
            exit 0
          fi
          echo "Comparing public API against last release tag $TAG"
          cargo semver-checks \
            --baseline-rev "$TAG" \
            -p iced_nodegraph \
            -p iced_nodegraph_sdf

  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --log-level error check
