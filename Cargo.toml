[workspace]
members = [
    "iced_nodegraph",
    "iced_nodegraph_sdf",
    "benches",
    "demos/hello_world",
    "demos/styling",
    "demos/interaction",
    "demos/500_nodes",
    "demos/shader_editor",
    "demos/common",
]
resolver = "2"

[workspace.package]
version = "0.5.0-dev"
edition = "2024"
authors = ["tuco86"]
license = "MIT"
repository = "https://github.com/tuco86/iced_nodegraph"

[workspace.dependencies]
# Core libraries. The `version` is required for publishing: crates.io strips
# the path and uses the version, so a versionless path dep cannot be published.
iced_nodegraph = { path = "iced_nodegraph", version = "0.5.0-dev" }
iced_nodegraph_sdf = { path = "iced_nodegraph_sdf", version = "0.5.0-dev" }
demo_common = { path = "demos/common" }

# Iced framework.
#
# The published libraries depend on `iced_widget`/`iced_wgpu`, never on the
# `iced` umbrella crate: Cargo unifies features additively, so an umbrella dep
# here would force iced's defaults (tiny-skia, web-colors, x11, wayland, ...) on
# every downstream application, which could then never turn them back off.
#
# `iced` itself is only for the demo binaries and for tests/doctests, and it
# keeps `default-features = false` so each member opts in explicitly.
iced = { version = "0.14", default-features = false }
iced_widget = "0.14"
iced_wgpu = "0.14"
iced_runtime = "0.14"
iced_test = "0.14"

# 0.1.1 is the first release that does not depend on the `iced` umbrella crate.
# Anything older re-enables iced's defaults for the whole demo graph, which is
# exactly what the `default-features = false` above exists to prevent.
iced_palette = "0.1.1"

# Coordinate transformations and math
euclid = { version = "0.22.11", features = ["bytemuck"] }
glam = { version = "0.33", features = ["bytemuck"] }
encase = "0.12"

# Utilities
pollster = "1"
web-time = "1.1"
parking_lot = "0.12"

# Demo-only
nanoid = "0.5"
directories = "6.0"
getrandom = "0.3"

# Dev / test / bench
proptest = "1"
criterion = "0.8"
png = "0.18"

# WASM support
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
