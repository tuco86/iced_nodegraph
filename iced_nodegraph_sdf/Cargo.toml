[package]
name = "iced_nodegraph_sdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Segment-based SDF renderer for Iced with exact distance fields"
repository.workspace = true
license.workspace = true
keywords = ["iced", "sdf", "distance-field", "gpu", "segment"]
categories = ["gui", "graphics", "rendering"]

[dependencies]
glam.workspace = true
encase.workspace = true
# `iced_wgpu` re-exports both `core` (= iced_core) and `wgpu`, so the `iced`
# umbrella crate is not needed. Depending on it would pull in the windowing
# shell and, because Cargo unifies features additively, force iced's default
# features (tiny-skia, web-colors, ...) on every downstream application.
iced_wgpu.workspace = true
web-time.workspace = true
parking_lot.workspace = true

[dev-dependencies]
pollster.workspace = true
png.workspace = true
